apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: three-tier
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "Password123!"
  MONGO_URL: "mongodb://admin:Password123!@mongodb-service.three-tier.svc.cluster.local:27017/threetierdb?authSource=admin"

