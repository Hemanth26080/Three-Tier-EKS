apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code
  namespace: three-tier
data:
  package.json: |
    {
      "name": "three-tier-backend",
      "version": "1.0.0",
      "main": "server.js",
      "scripts": { "start": "node server.js" },
      "dependencies": {
        "cors": "^2.8.5",
        "express": "^4.19.2",
        "mongoose": "^8.3.0"
      }
    }
  server.js: |
    const express = require('express');
    const mongoose = require('mongoose');
    const cors = require('cors');

    const app = express();
    app.use(express.json());
    app.use(cors());

    const MONGO_URI = process.env.MONGO_URL || process.env.MONGO_URI || 'mongodb://mongodb:27017/threetierdb';

    mongoose.connect(MONGO_URI)
      .then(() => console.log('Connected to MongoDB'))
      .catch(err => console.error('MongoDB connection error:', err));

    const ItemSchema = new mongoose.Schema({ name: String, createdAt: { type: Date, default: Date.now } });
    const Item = mongoose.model('Item', ItemSchema);

    app.get(['/health', '/api/health', '/healthz'], (req, res) => res.status(200).json({ status: 'healthy', database: mongoose.connection.readyState === 1 ? 'connected' : 'disconnected' }));

    app.get(['/items', '/api/items'], async (req, res) => {
      try {
        const items = await Item.find().sort({ createdAt: -1 });
        res.json(items);
      } catch (err) {
        res.status(500).json({ error: err.message });
      }
    });

    app.post(['/items', '/api/items'], async (req, res) => {
      try {
        const newItem = new Item({ name: req.body.name });
        await newItem.save();
        res.status(201).json(newItem);
      } catch (err) {
        res.status(500).json({ error: err.message });
      }
    });

    const PORT = process.env.PORT || 5000;
    app.listen(PORT, () => console.log(`Backend running on port ${PORT}`));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier
  labels:
    app: backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      volumes:
        - name: code-volume
          configMap:
            name: backend-code
        - name: app-volume
          emptyDir: {}
      initContainers:
        - name: init-app
          image: node:20-alpine
          command:
            - "sh"
            - "-c"
            - "cp /src/package.json /src/server.js /app/ && cd /app && npm install --only=production"
          volumeMounts:
            - name: code-volume
              mountPath: /src
            - name: app-volume
              mountPath: /app
      containers:
        - name: backend
          image: node:20-alpine
          workingDir: /app
          command:
            - "node"
            - "server.js"
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: app-volume
              mountPath: /app
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: three-tier
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: backend
